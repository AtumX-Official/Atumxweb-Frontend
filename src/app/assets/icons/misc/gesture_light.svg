<svg width="210" height="180" viewBox="0 0 210 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Wrist to MCP (Palm Bones) -->
  <line x1="105" y1="160" x2="80" y2="145" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="105" y1="160" x2="75" y2="115" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="105" y1="160" x2="100" y2="110" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="105" y1="160" x2="125" y2="112" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="105" y1="160" x2="145" y2="120" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  
  <!-- MCP to MCP (Palm Base Width) -->
  <line x1="75" y1="115" x2="100" y2="110" stroke="black" strokeWidth="3" strokeLinecap="round" opacity="0.4"/>
  <line x1="100" y1="110" x2="125" y2="112" stroke="black" strokeWidth="3" strokeLinecap="round" opacity="0.4"/>
  <line x1="125" y1="112" x2="145" y2="120" stroke="black" strokeWidth="3" strokeLinecap="round" opacity="0.4"/>

  <!-- Thumb bones -->
  <line x1="80" y1="145" x2="62" y2="130" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="62" y1="130" x2="50" y2="115" stroke="black" strokeWidth="4" strokeLinecap="round"/>
  <line x1="50" y1="115" x2="40" y2="100" stroke="black" strokeWidth="4" strokeLinecap="round"/>

  <!-- Index bones -->
  <line x1="75" y1="115" x2="68" y2="85" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="68" y1="85" x2="62" y2="60" stroke="black" strokeWidth="4" strokeLinecap="round"/>
  <line x1="62" y1="60" x2="57" y2="35" stroke="black" strokeWidth="4" strokeLinecap="round"/>

  <!-- Middle bones -->
  <line x1="100" y1="110" x2="98" y2="75" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="98" y1="75" x2="97" y2="48" stroke="black" strokeWidth="4" strokeLinecap="round"/>
  <line x1="97" y1="48" x2="96" y2="20" stroke="black" strokeWidth="4" strokeLinecap="round"/>

  <!-- Ring bones -->
  <line x1="125" y1="112" x2="128" y2="80" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="128" y1="80" x2="130" y2="52" stroke="black" strokeWidth="4" strokeLinecap="round"/>
  <line x1="130" y1="52" x2="132" y2="25" stroke="black" strokeWidth="4" strokeLinecap="round"/>

  <!-- Pinky bones -->
  <line x1="145" y1="120" x2="152" y2="95" stroke="black" strokeWidth="5" strokeLinecap="round"/>
  <line x1="152" y1="95" x2="157" y2="75" stroke="black" strokeWidth="4" strokeLinecap="round"/>
  <line x1="157" y1="75" x2="162" y2="55" stroke="black" strokeWidth="4" strokeLinecap="round"/>

  <!-- Joint Points (Highlighting tips with special colors matching pose) -->
  <!-- Wrist -->
  <circle cx="105" cy="160" r="6" fill="#F6EC24" stroke="black" strokeWidth="1.5"/>

  <!-- Normal Joints (Magenta) -->
  <circle cx="80" cy="145" r="4.5" fill="#F6268B"/>
  <circle cx="62" cy="130" r="4" fill="#F6268B"/>
  <circle cx="50" cy="115" r="4" fill="#F6268B"/>
  
  <circle cx="75" cy="115" r="4.5" fill="#F6268B"/>
  <circle cx="68" cy="85" r="4" fill="#F6268B"/>
  <circle cx="62" cy="60" r="4" fill="#F6268B"/>

  <circle cx="100" cy="110" r="4.5" fill="#F6268B"/>
  <circle cx="98" cy="75" r="4" fill="#F6268B"/>
  <circle cx="97" cy="48" r="4" fill="#F6268B"/>

  <circle cx="125" cy="112" r="4.5" fill="#F6268B"/>
  <circle cx="128" cy="80" r="4" fill="#F6268B"/>
  <circle cx="130" cy="52" r="4" fill="#F6268B"/>

  <circle cx="145" cy="120" r="4.5" fill="#F6268B"/>
  <circle cx="152" cy="95" r="4" fill="#F6268B"/>
  <circle cx="157" cy="75" r="4" fill="#F6268B"/>

  <!-- Fingertips (Violet highlight) -->
  <circle cx="40" cy="100" r="5" fill="#8726F6" stroke="black" strokeWidth="1"/>
  <circle cx="57" cy="35" r="5" fill="#8726F6" stroke="black" strokeWidth="1"/>
  <circle cx="96" cy="20" r="5" fill="#8726F6" stroke="black" strokeWidth="1"/>
  <circle cx="132" cy="25" r="5" fill="#8726F6" stroke="black" strokeWidth="1"/>
  <circle cx="162" cy="55" r="5" fill="#8726F6" stroke="black" strokeWidth="1"/>
</svg>
