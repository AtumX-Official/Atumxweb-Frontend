<svg width="210" height="180" viewBox="0 0 210 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Curve connecting wave peaks -->
  <path d="M 30 70 L 55 45 L 80 80 L 105 30 L 130 60 L 155 40 L 180 75" stroke="black" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/>

  <!-- Wave bars -->
  <line x1="30" y1="130" x2="30" y2="70" stroke="black" strokeWidth="5" strokeLinecap="round" opacity="0.3"/>
  <line x1="55" y1="150" x2="55" y2="45" stroke="black" strokeWidth="5" strokeLinecap="round" opacity="0.3"/>
  <line x1="80" y1="120" x2="80" y2="80" stroke="black" strokeWidth="5" strokeLinecap="round" opacity="0.3"/>
  <line x1="105" y1="160" x2="105" y2="30" stroke="black" strokeWidth="5" strokeLinecap="round" opacity="0.3"/>
  <line x1="130" y1="140" x2="130" y2="60" stroke="black" strokeWidth="5" strokeLinecap="round" opacity="0.3"/>
  <line x1="155" y1="155" x2="155" y2="40" stroke="black" strokeWidth="5" strokeLinecap="round" opacity="0.3"/>
  <line x1="180" y1="125" x2="180" y2="75" stroke="black" strokeWidth="5" strokeLinecap="round" opacity="0.3"/>

  <!-- Wave peaks nodes (Representing discrete feature points matching Hand/Pose design) -->
  <circle cx="30" cy="70" r="6" fill="#F6268B" stroke="black" strokeWidth="1.5"/>
  <circle cx="55" cy="45" r="6" fill="#F6268B" stroke="black" strokeWidth="1.5"/>
  <circle cx="80" cy="80" r="6" fill="#F6EC24" stroke="black" strokeWidth="1.5"/>
  <circle cx="105" cy="30" r="8" fill="#8726F6" stroke="black" strokeWidth="2"/>
  <circle cx="130" cy="60" r="6" fill="#F6268B" stroke="black" strokeWidth="1.5"/>
  <circle cx="155" cy="40" r="6" fill="#F6268B" stroke="black" strokeWidth="1.5"/>
  <circle cx="180" cy="75" r="6" fill="#8726F6" stroke="black" strokeWidth="1.5"/>
</svg>
